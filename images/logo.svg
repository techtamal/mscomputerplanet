<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0099cc"/>
      <stop offset="100%" stop-color="#004e92"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Globe Circuit Icon -->
  <g transform="translate(15, 10)">
    <circle cx="50" cy="50" r="45" fill="url(#globeGrad)" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="50" cy="50" rx="25" ry="45" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="5" y1="50" x2="95" y2="50" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
    <line x1="15" y1="28" x2="85" y2="28" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <line x1="15" y1="72" x2="85" y2="72" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Digital Tech Circuit Nodes -->
    <path d="M 30,35 L 50,45 L 70,30" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    <path d="M 25,65 L 45,55 L 65,70" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="35" r="3.5" fill="#10b981"/>
    <circle cx="50" cy="45" r="4" fill="#34d399" filter="url(#glow)"/>
    <circle cx="70" cy="30" r="3" fill="#38bdf8"/>
    <circle cx="25" cy="65" r="3" fill="#38bdf8"/>
    <circle cx="45" cy="55" r="3.5" fill="#10b981"/>
    <circle cx="65" cy="70" r="3" fill="#34d399"/>

    <!-- Orbit Rings -->
    <path d="M 10,75 C 20,95 80,105 95,70 C 105,45 85,15 70,10" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="95" cy="70" r="3.5" fill="#00d2ff"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <text x="0" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="2">M/S</text>
    <text x="0" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="900" fill="#0f172a" letter-spacing="1.5">COMPUTER <tspan fill="#0284c7">PLANET</tspan></text>
    <text x="2" y="80" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="800" fill="#64748b" letter-spacing="4.5">SALES &amp; SUPPORT · SILCHAR</text>
  </g>
</svg>
