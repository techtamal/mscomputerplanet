[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/erp/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "http://mscomputerplanet.com/*"
  to = "https://www.mscomputerplanet.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://mscomputerplanet.com/*"
  to = "https://www.mscomputerplanet.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/erp"
  to = "/erp/index.html"
  status = 200

[[redirects]]
  from = "/erp/*"
  to = "/erp/index.html"
  status = 200

[[redirects]]
  from = "/simple"
  to = "/simple.html"
  status = 200

[[redirects]]
  from = "/simple-erp"
  to = "/simple.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
